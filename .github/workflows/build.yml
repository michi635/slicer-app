name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# One build at a time; a newer push waits instead of cancelling a dependency build that takes hours.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The engine for phones and tablets.
  engine-arm64:
    uses: ./.github/workflows/engine.yml
    with:
      abi: arm64-v8a

  # The same engine for the x86_64 Android emulator, only for the automatic test.
  engine-x86_64:
    uses: ./.github/workflows/engine.yml
    with:
      abi: x86_64

  # Slices test models on an Android emulator and checks the G-code.
  engine-test:
    needs: engine-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: engine-x86_64
          path: test/engine

      - uses: actions/download-artifact@v4
        with:
          name: orca-resources-x86_64
          path: test/res

      - name: Test models
        run: python3 engine/tests/make_models.py test/models

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Slice on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash engine/tests/run-on-device.sh test

      - name: Check results
        run: python3 engine/tests/check_results.py test/results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-test-results
          path: test/results/
          retention-days: 14

  # The Android app, signed, published as a GitHub release.
  app:
    needs: engine-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: engine-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a

      - uses: actions/download-artifact@v4
        with:
          name: orca-resources-arm64-v8a
          path: android/app/src/main/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ls -la app/src/main/jniLibs/arm64-v8a app/src/main/assets
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/slicer-app.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: slicer-app-apk
          path: slicer-app.apk
          retention-days: 30

  # Publish only when the engine passed its test on the emulator.
  release:
    needs: [app, engine-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: slicer-app-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.${{ github.run_number }}"
          notes="$(git log -1 --format=%B | head -n 20)"
          gh release create "$tag" slicer-app.apk --title "Slicer $tag" --notes "$notes" --latest
