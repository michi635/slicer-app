name: Engine

# Builds OrcaSlicer's dependencies (cached), libslic3r and slicercore for one Android ABI.
on:
  workflow_call:
    inputs:
      abi:
        required: true
        type: string

env:
  WORK: /mnt/w
  ABI: ${{ inputs.abi }}

jobs:
  # Boost, OCCT, OpenCV, ... Hours on a fresh build, then cached.
  deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache key
        id: key
        run: |
          h=$(cat engine/orca.env engine/patches/*.patch engine/patches/local/*.patch engine/scripts/fetch-orca.sh engine/scripts/build-deps.sh 2>/dev/null | sha256sum | cut -c1-16)
          echo "key=deps-$ABI-$h" >> "$GITHUB_OUTPUT"

      - name: Select ABI
        run: sed -i "s/^ABI=.*/ABI=$ABI/" engine/orca.env

      - name: Prepare work directory
        run: sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"

      - name: Restore dependencies
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/w/deps
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          df -h /

      - name: Install tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build m4 autoconf automake libtool pkg-config gettext
          source engine/orca.env
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Fetch OrcaSlicer
        if: steps.cache.outputs.cache-hit != 'true'
        run: engine/scripts/fetch-orca.sh "$WORK/orcaslicer-src"

      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: engine/scripts/build-deps.sh "$WORK/orcaslicer-src" "$WORK/deps" "$WORK/dl"

      - name: Dependency build logs
        if: failure()
        run: |
          find "$WORK/orcaslicer-src/deps/build-android" -name '*-err.log' -size +0 2>/dev/null | while read -r f; do echo "== $f"; tail -n 60 "$f"; done
          df -h /

      - name: Save dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /mnt/w/deps
          key: ${{ steps.key.outputs.key }}

  # libslic3r and our slicer executable (engine/core).
  build:
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Select ABI
        run: sed -i "s/^ABI=.*/ABI=$ABI/" engine/orca.env

      - name: Prepare work directory
        run: sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: /mnt/w/deps
          key: ${{ needs.deps.outputs.key }}
          fail-on-cache-miss: true

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/w/ccache
          key: ccache-${{ inputs.abi }}-${{ github.run_id }}
          restore-keys: ccache-${{ inputs.abi }}-

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build ccache
          source engine/orca.env
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$WORK/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          cmake --version | head -1

      - name: Fetch OrcaSlicer
        run: engine/scripts/fetch-orca.sh "$WORK/orcaslicer-src"

      - name: Build engine
        run: |
          ccache -z || true
          engine/scripts/build-engine.sh "$WORK" "$WORK/deps/usr/local" "$WORK/out"
          ccache -s || true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/w/ccache
          key: ccache-${{ inputs.abi }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ inputs.abi }}
          path: /mnt/w/out/
          retention-days: 14

      - name: Pack profiles
        run: |
          mkdir -p "$WORK/res"
          engine/scripts/pack-resources.sh "$WORK/orcaslicer-src" "$WORK/res/orca.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: orca-resources-${{ inputs.abi }}
          path: /mnt/w/res/orca.zip
          retention-days: 14
